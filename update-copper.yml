name: Update Copper Fundamentals

on:
  workflow_dispatch:
    inputs:
      force_official_inventory:
        description: 'Bypass 6h official LME/SHFE/CME retry cooldown for one diagnostic run'
        required: false
        default: false
        type: boolean
  schedule:
    # GitHub Actions cron uses UTC. Run 3 times/day at 06:20, 14:20, 22:20 KST.
    - cron: '20 5,13,21 * * *'

permissions:
  contents: write

# Scheduled production cadence is intentionally limited to 3 runs/day.
# Queue a new run if a previous run is still active; partial output is never published.
concurrency:
  group: copper-fundamentals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Preserve last published payload for this run
        run: |
          mkdir -p .run-backup
          cp -f public/data/copper_fundamentals.json .run-backup/copper_fundamentals.json 2>/dev/null || true
          cp -f public/data/api_health.json .run-backup/api_health.json 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect copper data and enrich inventory evidence
        env:
          COPPER_FORCE_OFFICIAL_INVENTORY: ${{ github.event_name == 'workflow_dispatch' && inputs.force_official_inventory && '1' || '0' }}
        run: python src/collect.py

      - name: Apply bounded last-good publish guard
        run: python src/finalize_guard.py

      - name: Validate output and safety mode
        run: |
          python tests/validate_output.py
          python tests/safety_mode_test.py
          python tests/copper_v3_test.py
          python tests/official_inventory_test.py
          python tests/freshness_semantics_v4_test.py
          python tests/provider_diagnostics_v4_test.py
          python tests/lme_parser_layouts_v4_test.py
          python tests/finalize_guard_test.py

      - name: Print four target indicators
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('public/data/copper_fundamentals.json').read_text())
          print(json.dumps({
            'officialIndicators': d.get('officialIndicators'),
            'lmeDiagnostics': ((d.get('physical') or {}).get('diagnostics') or {}).get('lme'),
            'lmeOfficialMonthlyDiagnostics': ((d.get('physical') or {}).get('diagnostics') or {}).get('lmeOfficialMonthly'),
            'shfeDiagnostics': ((d.get('physical') or {}).get('diagnostics') or {}).get('shfe'),
            'officialInventoryDerived': (d.get('physical') or {}).get('officialInventoryDerived'),
            'inventoryEvidence': d.get('inventoryEvidence'),
            'officialDirectInventoryHealth': ((d.get('apiHealth') or {}).get('sources') or {}).get('inventory'),
            'officialInventoryHealth': ((d.get('apiHealth') or {}).get('sources') or {}).get('official_inventory_derived'),
            'curve': d.get('curve'),
            'curveHealth': ((d.get('apiHealth') or {}).get('sources') or {}).get('curve'),
            'supplyHealth': ((d.get('apiHealth') or {}).get('sources') or {}).get('supply')
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit updated data and API health
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: update copper fundamentals"
            git pull --rebase origin main
            git push origin main
          fi
