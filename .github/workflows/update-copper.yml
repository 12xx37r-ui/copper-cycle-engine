name: Update Copper Fundamentals

on:
  workflow_dispatch:
  schedule:
    # Weekdays: approximately every 3h30m. GitHub cron cannot express an
    # exact 210-minute interval across a 24-hour boundary, so these two
    # schedules alternate :20 / :50 and preserve 3h30m spacing through most
    # of the day; the UTC day boundary has one 3-hour gap.
    - cron: '20 0,7,14,21 * * 1-5'
    - cron: '50 3,10,17 * * 1-5'
    # Weekends: slower refresh to reduce unnecessary market/API traffic.
    - cron: '20 */8 * * 0,6'

permissions:
  contents: write

concurrency:
  group: copper-fundamentals
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect copper data
        run: python src/collect.py

      - name: Validate output and safety mode
        run: |
          python tests/validate_output.py
          python tests/safety_mode_test.py

      - name: Commit updated data and API health
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: update copper fundamentals"
            git push origin main
          fi
