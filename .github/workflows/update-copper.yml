name: Update Copper Fundamentals
on:
  workflow_dispatch:
  schedule:
    - cron: '20 21 * * *'
permissions:
  contents: write
concurrency:
  group: copper-fundamentals
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/collect.py
      - run: python tests/validate_output.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "data: update copper fundamentals"
          git push
